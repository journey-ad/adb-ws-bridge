name: Publish latest.json

# 打 tag 的发布流程由 android.yml 在创建 release 后直接生成索引，这里只用于手动重跑
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要索引的 tag，留空取最新 release
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/publish-latest-json.sh
