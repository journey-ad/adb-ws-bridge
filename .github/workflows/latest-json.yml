name: Publish latest.json

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p public
          if [ -n "$TAG" ]; then
            gh api "repos/$REPO/releases/tags/$TAG" > release.json
          else
            gh api "repos/$REPO/releases/latest" > release.json
          fi
          python3 - <<'PY'
          import json

          release = json.load(open("release.json"))
          urls = {asset["name"]: asset["browser_download_url"] for asset in release["assets"]}

          def find(suffix):
              return next((url for name, url in urls.items() if name.endswith(suffix)), None)

          data = {
              "version": release["tag_name"],
              "publishedAt": release["published_at"],
              "assets": {
                  "universal": find("-universal.apk"),
                  "arm64-v8a": find("-arm64-v8a.apk"),
                  "armeabi-v7a": find("-armeabi-v7a.apk"),
                  "x86_64": find("-x86_64.apk"),
              },
          }
          with open("public/latest.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Push to index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd public
          git init -b index
          git add latest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore：更新 latest.json"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" index
